[project]
name = "otec"
version = "0.1.0"
description = "Delhi terrain and flood replay — reproducible local simulation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "rasterio>=1.4,<2",
  "geopandas>=1.0,<2",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "requests>=2.32,<3",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "networkx>=3.4,<4",
]

[dependency-groups]
dev = ["httpx>=0.27,<1"]

[tool.uv]
package = false
